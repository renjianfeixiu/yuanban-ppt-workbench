name: Build standalone downloads
run-name: Standalone downloads for ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release containing the portable source ZIP
        required: true
        default: v0.3.0

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: windows-x64 }
          - { runner: windows-11-arm, target: windows-arm64 }
          - { runner: macos-latest, target: macos-arm64 }
          - { runner: macos-15-intel, target: macos-x64 }
          - { runner: ubuntu-22.04, target: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch the tagged source distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "yuanban-ppt-workbench-$TAG-portable.zip"
      - name: Build ZIP, start its launcher, and test PPTX export
        run: python .github/scripts/package-native.py "yuanban-ppt-workbench-$TAG-portable.zip" "$TARGET" "$TAG"
      - name: Attach the verified ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY"
